spring:
  main:
    banner-mode: "off"
  application:
    name: money-load-velocity-limit
  datasource:
    url: ${MONEYLOAD_DB_URL:jdbc:h2:file:./data/moneyload;AUTO_SERVER=TRUE}
    username: sa
    password: ""
  flyway:
    enabled: true

velocity:
  limits:
    daily-amount: "5000.00"
    weekly-amount: "20000.00"
    daily-count: 3

management:
  endpoints:
    web:
      exposure:
        include: health

processing:
  file:
    workers: 4
    window-size: 256
    max-concurrent-uploads: 2
    timeout: 5m
